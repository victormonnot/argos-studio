[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "argos-studio"
version = "0.1.0"
description = "A local UAV engineering workspace for recorded, inspectable experiments."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.54,<0.55",
    "pymavlink==2.4.49",
    "httpx>=0.28,<0.29",
    "python-dotenv>=1.2.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10", "ruff>=0.16,<0.17"]

[project.scripts]
argos-studio = "argos_studio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
argos_studio = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
